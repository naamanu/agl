[package]
name = "agl"
version = "0.3.0"
edition = "2024"
rust-version = "1.94"
description = "A tiny typed DSL for agentic applications"
license = "MIT"
repository = "https://github.com/naamanu/agl"
homepage = "https://nanamanu.com/agl"
keywords = ["agents", "dsl", "workflow", "llm"]
categories = ["compilers", "command-line-utilities"]
include = [
  "Cargo.toml",
  "Cargo.lock",
  "src/**",
  "tests/**",
  "examples/**",
  "benches/**",
  "docs/**",
  "spec/**",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
]

[lib]
name = "agl"
path = "src/lib.rs"

[[bin]]
name = "agl"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
regex = "1"
url = "2"

[dev-dependencies]
pretty_assertions = "1"

[[bench]]
name = "runtime"
harness = false
