[book]
title = "AgentLang"
authors = ["Nana Adjei Manu"]
description = "A tiny DSL for agentic workflows — agents, typed tasks, workflows, and pipelines."
language = "en"
src = "docs"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
mathjax-support = true
# Keep TeX prime markers as ASCII apostrophes.
smart-punctuation = false
no-section-label = true
git-repository-url = "https://github.com/naamanu/agl"
edit-url-template = "https://github.com/naamanu/agl/edit/main/{path}"
site-url = "/agl/"

[output.html.playground]
runnable = false

# Preserve the directory URLs used by the previous documentation site.
[output.html.redirect]
"tutorial/quickstart/index.html" = "../quickstart.html"
